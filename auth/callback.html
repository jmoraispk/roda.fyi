<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#17120D">
  <title>Completing sign in · Roda</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/assets/auth.css">
</head>
<body class="auth-callback-page">
  <main class="auth-callback-card">
    <div id="callbackStatus" role="status" aria-live="polite">
      <h1>Bringing you into the roda…</h1>
      <p>We are securely completing your sign-in.</p>
    </div>
    <div id="callbackError" role="alert" hidden>
      <h1>Sign-in needs another try</h1>
      <p>We could not complete your sign-in. The link may be invalid or expired.</p>
      <div class="auth-callback-actions">
        <a href="/">Sign in again</a>
        <a href="/app">Open Roda</a>
      </div>
    </div>
  </main>
  <script type="module" src="/assets/generated/auth-callback.js"></script>
</body>
</html>
