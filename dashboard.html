<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#17120D">
  <title>Dashboard · Roda</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body>
  <div class="dashboard-grain" aria-hidden="true"></div>
  <p class="dashboard-loading" id="dashboardLoading" role="status">Opening your roda…</p>

  <div id="dashboardApp" hidden>
    <header class="dashboard-header">
      <a class="dashboard-brand" href="/"><span></span><b>RODA</b></a>
      <div class="dashboard-account">
        <button class="quiet-button" id="editProfile" type="button"><span id="profileName"></span> · Profile</button>
        <button class="quiet-button" id="signOut" type="button">Sign out</button>
      </div>
    </header>

    <main class="dashboard-shell">
      <div class="dashboard-topline">
        <div class="mode-switch" role="group" aria-label="Dashboard mode">
          <button type="button" data-mode="training" aria-pressed="true">My Training</button>
          <button type="button" data-mode="coaching" aria-pressed="false">Coaching</button>
        </div>

        <label class="group-context" id="groupContextLabel" hidden>
          <span>Group context</span>
          <select id="groupContext"></select>
        </label>
      </div>

      <p class="dashboard-status" id="dashboardStatus" role="status" aria-live="polite"></p>
      <section class="dashboard-content" id="dashboardContent" aria-live="polite"></section>
    </main>
  </div>

  <dialog class="profile-dialog" id="profileDialog" aria-labelledby="profileDialogTitle">
    <form id="profileForm">
      <button class="profile-close" id="profileCancel" type="button" aria-label="Close profile settings">×</button>
      <div class="profile-kicker">Practitioner profile</div>
      <h1 id="profileDialogTitle">Complete your profile</h1>
      <p class="profile-intro">One profile follows your personal training and any groups you coach.</p>

      <label class="field-label" for="profileDisplayName">Display name</label>
      <input class="field-input" id="profileDisplayName" name="displayName" required maxlength="80" autocomplete="name">

      <label class="field-label" for="profilePicture">Profile picture (optional)</label>
      <input class="field-file" id="profilePicture" name="picture" type="file" accept="image/jpeg,image/png,image/webp">

      <fieldset class="timezone-fieldset">
        <legend>Timezone</legend>
        <label class="automatic-choice">
          <input id="automaticTimezone" type="checkbox" aria-label="Use automatic timezone" checked>
          <span id="automaticTimezoneLabel">Automatic</span>
        </label>
        <label class="field-label" for="timezoneOverride">Timezone override</label>
        <input class="field-input" id="timezoneOverride" name="timezoneOverride" placeholder="Europe/Lisbon" disabled>
        <small>Optional. Historical training days will keep the timezone used when they were recorded.</small>
      </fieldset>

      <label class="leaderboard-choice">
        <input id="leaderboardVisible" type="checkbox" checked>
        <span>Include my activity in future group rankings</span>
      </label>

      <p class="profile-status" id="profileStatus" role="status" aria-live="polite"></p>
      <button class="primary-button" id="saveProfile" type="submit">Save profile</button>
    </form>
  </dialog>

  <script type="module" src="/assets/generated/dashboard.js"></script>
</body>
</html>
